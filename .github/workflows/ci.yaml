name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
      - '**.md'
      - renovate.json
      - LICENSE
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: ci-${{ github.repository }}-${{ github.ref }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup / Publish check
        id: ci
        uses: psychodracon/github-workflows/.github/actions/publish-check@v1

      - name: Setup / Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ci.outputs.ref }}
          fetch-depth: 0

      - name: Setup / Version
        id: version
        if: steps.ci.outputs.publish == 'true'
        uses: psychodracon/github-workflows/.github/actions/version@v1
        with:
          type: msbuild
          paths: Directory.Build.props
          bump: ${{ inputs.version_bump }}

      - name: Build / .NET
        uses: psychodracon/github-workflows/.github/actions/dotnet-ci@v1

      - name: Release / Changelog
        if: steps.ci.outputs.publish == 'true'
        uses: orhun/git-cliff-action@v4.9.1
        with:
          args: --tag v${{ steps.version.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Release / Notes
        if: steps.ci.outputs.publish == 'true'
        uses: orhun/git-cliff-action@v4.9.1
        with:
          args: --tag v${{ steps.version.outputs.version }} --unreleased --strip header
        env:
          OUTPUT: ${{ runner.temp }}/notes.md

      - name: Release / Package
        if: steps.ci.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet publish WindowMover/WindowMover.csproj -c Release --sc -r win-x64 -o publish
          dotnet tool restore
          dotnet vpk download github --repoUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --token "$GH_TOKEN" || echo "::notice::No previous release to download"
          dotnet vpk pack --packId WindowMover --packVersion "$VERSION" --packDir publish --mainExe WindowMover.exe --releaseNotes "$RUNNER_TEMP/notes.md"

      - name: Repo / Commit and tag version
        if: steps.ci.outputs.publish == 'true'
        uses: psychodracon/github-workflows/.github/actions/git-release@v1
        with:
          version: ${{ steps.version.outputs.version }}
          files: ${{ steps.version.outputs.files }} CHANGELOG.md

      # vpk uploads only this version's assets, with the release notes embedded by pack.
      - name: Release / GitHub release
        if: steps.ci.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: dotnet vpk upload github --repoUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --token "$GH_TOKEN" --tag "v${VERSION}" --releaseName "v${VERSION}" --publish

      - name: Notify
        if: failure()
        uses: psychodracon/github-workflows/.github/actions/notify@v1
        with:
          status: ${{ job.status }}
          version: ${{ steps.version.outputs.version }}
          token: ${{ secrets.PUSHOVER_API_TOKEN }}
          user: ${{ secrets.PUSHOVER_USER_KEY }}
          devices: ${{ secrets.PUSHOVER_DEVICES }}
